name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: python -m pip install pillow

      - name: Install Node deps
        run: npm ci

      - name: Smoke checks
        run: npm run smoke

      - name: Generate demo assets
        run: npm run demo:gif

      - name: Upload docs assets
        uses: actions/upload-artifact@v4
        with:
          name: docs-assets
          path: |
            docs/demo.gif
            docs/social-preview.png
